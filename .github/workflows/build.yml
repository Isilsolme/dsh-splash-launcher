name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $ver="1.0.4191.47"
          $pk="packages\ms.webview2"; New-Item -ItemType Directory -Force -Path "$pk\bin" | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile "$pk\wv2.nupkg"
          Expand-Archive "$pk\wv2.nupkg" -DestinationPath "$pk\pkg" -Force
          Copy-Item "$pk\pkg\lib\net462\Microsoft.Web.WebView2.Core.dll","$pk\pkg\lib\net462\Microsoft.Web.WebView2.Wpf.dll","$pk\pkg\runtimes\win-x64\native\WebView2Loader.dll" "$pk\bin\"

      - name: Build DSH-GUI.exe
        shell: cmd
        run: build.cmd

      - name: Self test (validates embedded assets + dsh resolution)
        shell: cmd
        run: DSH-GUI.exe --selftest

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
          if ($ver -eq $env:GITHUB_REF) { $ver = "v$($env:GITHUB_RUN_NUMBER)-dev" }
          $zip = "dsh-splash-launcher-$ver.zip"
          Compress-Archive -Path DSH-GUI.exe, README.md, README.en.md, LICENSE -DestinationPath $zip -Force
          Write-Host "portable zip: $zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-gui
          path: |
            DSH-GUI.exe
            dsh-splash-launcher-*.zip
            selftest.txt
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DSH-GUI.exe
            dsh-splash-launcher-*.zip
